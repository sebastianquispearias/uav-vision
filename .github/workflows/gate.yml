# The gate, run on a machine that has never seen this project.
#
# That is the whole point of running it here and not only on the laptop: the laptop has the
# companion repositories next to it, the flight archive on disk and every model downloaded, so a
# gate that passes there says nothing about what somebody gets when they clone. This runner
# starts from the repository and the two files below, which is what a reader has.
#
# Two jobs, and the split is the claim each one makes:
#
#   clon-pelado   nothing but this repository and numpy. It proves the part of the system that
#                 is self-contained: 36 of the 50 python gates, all 10 of the .js gates, ruff.
#   con-runtime   plus the GrADyS runtime from its public repository, which is what the first
#                 command of the README needs. It proves the full 50 + 10 gate, the 2.39 m
#                 replay, and the scoreboard of docs/RESULTADOS.md.
#
# The scoreboard is only in the second job, and that is not an oversight. Scoring by person reads
# a candidates file that replay_vuelo3.py --candidatos writes, that file is gitignored on purpose
# because it describes a RUN and is not source, and the replay imports the GrADyS runtime. So the
# only honest way to assert that number is to regenerate it first, which is what this job does.
#
# The .js gates need node and nothing else, so they run in the bare job.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clon-pelado:
    name: clon pelado (solo este repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: instalar solo el paquete
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest

      - name: ruff
        run: ruff check .

      - name: los gates de la estacion (node, sin navegador)
        run: |
          for t in tests/test_gs_*.js; do echo "== $t"; node "$t"; done

      - name: los gates de python que no necesitan el runtime
        run: pytest -q -p no:cacheprovider

      - name: y el marcador dice QUE le falta, en vez de un traceback
        run: |
          python scripts/personas_encontradas.py 2>&1 | tee /tmp/salida.txt || true
          grep -q "que lo escribe el replay" /tmp/salida.txt

  con-runtime:
    name: con el runtime de GrADyS (lo que pide el README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar lo que pide el README
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install pytest

      - name: los 50 gates de python
        run: pytest -q -p no:cacheprovider

      - name: el replay del vuelo grabado, que tiene que dar 2.39 m
        run: |
          python demo/demo.py --sin-mapa | tee /tmp/demo.txt
          grep -q "mejor POI respecto al operador: 2.39 m" /tmp/demo.txt

      - name: los candidatos REGENERADOS por la cadena viva dan el mismo marcador
        run: |
          UAV_VISION_DATOS=demo/data python scripts/replay_vuelo3.py \
            --pistas=demo/data/pistas_bot_cmc_sof.npz \
            --candidatos=/tmp/candidatos.json > /dev/null
          python scripts/personas_encontradas.py --candidatos /tmp/candidatos.json | tee /tmp/vivo.txt
          grep -q "personas reales reportadas: 5 de 7" /tmp/vivo.txt
          grep -q "FANTASMAS (candidatos que no son nadie): 6" /tmp/vivo.txt
